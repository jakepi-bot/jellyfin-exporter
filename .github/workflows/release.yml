name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version and check it matches the tag
        id: version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Directory.Build.props version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Package plugin zip
        run: python3 scripts/package.py

      - name: Create GitHub release and attach the zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version='${{ steps.version.outputs.version }}'
          gh release create "v${version}" \
            "artifacts/jellyfin-exporter_${version}.zip" \
            --title "Jellyfin Exporter ${version}" \
            --notes "See the changelog in manifest.json. Install from Jellyfin > Plugins > Repositories using https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/manifest.json"

      - name: Update the plugin repository manifest
        run: |
          version='${{ steps.version.outputs.version }}'
          python3 scripts/update_manifest.py \
            --version "${version}" \
            --zip "artifacts/jellyfin-exporter_${version}.zip"

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json already up to date"
            exit 0
          fi
          git commit -m "manifest: publish ${GITHUB_REF_NAME}"
          git push origin HEAD:main
