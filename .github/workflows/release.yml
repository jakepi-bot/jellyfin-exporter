name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version and check it matches the tag
        id: version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Directory.Build.props version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Package plugin zip
        run: python3 scripts/package.py

      - name: Create GitHub release and attach the zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version='${{ steps.version.outputs.version }}'
          tag="v${version}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Jellyfin Exporter ${version}" \
              --notes "Install from Jellyfin > Plugins > Repositories using https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/manifest.json"
          fi
          gh release upload "$tag" "artifacts/jellyfin-exporter_${version}.zip" --clobber

      - name: Update the plugin repository manifest
        run: |
          version='${{ steps.version.outputs.version }}'
          python3 scripts/update_manifest.py \
            --version "${version}" \
            --zip "artifacts/jellyfin-exporter_${version}.zip" \
            --source-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/jellyfin-exporter_${version}.zip"

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json already up to date"
            exit 0
          fi
          git commit -m "manifest: publish ${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected, retrying on top of origin/main (attempt ${attempt})"
            sleep 5
          done
          echo "could not publish manifest.json to main" >&2
          exit 1
