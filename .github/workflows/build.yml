name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - manifest.json
      - '**/*.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Package plugin zip
        run: python3 scripts/package.py

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-exporter
          path: artifacts/*.zip
          if-no-files-found: error
